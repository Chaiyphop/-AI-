  <text x="530" y="355" fill="#e94560" font-size="11" font-weight="bold">31. Genetic Code Compiler</text>
  <text x="530" y="371" fill="#888" font-size="9">Protein = C[mRNA] — คอมไพเลอร์พันธุกรรม</text>

  <text x="530" y="390" fill="#e94560" font-size="11" font-weight="bold">32. Epigenetic Switch</text>
  <text x="530" y="406" fill="#888" font-size="9">f(E) = 1/(1+e^(−k(E−E₀))) — สวิตช์เหนือพันธุกรรม</text>

  <text x="530" y="425" fill="#e94560" font-size="11" font-weight="bold">33. Cellular Automata Aging</text>
  <text x="530" y="441" fill="#888" font-size="9">State(t+1) = R(Neighborhood(t))</text>

  <text x="750" y="355" fill="#e94560" font-size="11" font-weight="bold">34. Synthetic Life Stability</text>
  <text x="750" y="371" fill="#888" font-size="9">dS_int/dt + dS_ext/dt ≤ 0</text>

  <text x="750" y="390" fill="#e94560" font-size="11" font-weight="bold">35. BCI Bandwidth</text>
  <text x="750" y="406" fill="#888" font-size="9">BW = N·f·log₂(S_levels)</text>

  <text x="750" y="425" fill="#e94560" font-size="11" font-weight="bold">36. Consciousness Substrate</text>
  <text x="750" y="441" fill="#888" font-size="9">C(P) ⇔ C(S) if I(P) ≅ I(S)</text>

  <rect x="510" y="450" width="460" height="35" rx="6" fill="#0f3460" opacity="0.5"/>
