  <text x="530" y="565" fill="#e94560" font-size="10" font-weight="bold">51. Computation-Existence</text>
  <text x="530" y="580" fill="#888" font-size="8">E ⇔ C(U) — การดำรงอยู่ = การคำนวณ</text>

  <text x="530" y="598" fill="#e94560" font-size="10" font-weight="bold">52. Information Conservation</text>
  <text x="530" y="613" fill="#888" font-size="8">∮I·dA = dQ_info/dt — สารสนเทศไม่มีวันสูญหาย</text>

  <text x="530" y="631" fill="#e94560" font-size="10" font-weight="bold">53. Least Complexity</text>
  <text x="530" y="646" fill="#888" font-size="8">δ∫K(ψ(t))dt = 0 — ธรรมชาติเลือกเส้นทางที่ซับซ้อนน้อยที่สุด</text>

  <text x="750" y="565" fill="#e94560" font-size="10" font-weight="bold">54. Consciousness-Feedback</text>
