  <text x="500" y="40" text-anchor="middle" fill="#e94560" font-size="22" font-weight="bold" filter="url(#glow)">คลังองค์ความรู้ — The Knowledge Codex</text>
  <line x1="200" y1="55" x2="800" y2="55" stroke="#e94560" stroke-width="1" opacity="0.5"/>

  <!-- ===== COGNITIVE ===== -->
  <rect x="30" y="80" width="460" height="200" rx="10" fill="#1a1a2e" stroke="#e94560" stroke-width="1"/>
  <rect x="30" y="80" width="460" height="35" rx="10" fill="url(#h1)"/>
  <rect x="30" y="100" width="460" height="15" fill="url(#h1)"/>
  <text x="260" y="103" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Cognitive &amp; Algorithmic Dynamics (10 สูตร)</text>

  <text x="50" y="140" fill="#e94560" font-size="11" font-weight="bold">1. Learning Velocity Limit</text>
  <text x="50" y="156" fill="#888" font-size="9">dK/dt ≤ (I_c · η_a) / S_net — ขีดจำกัดความเร็วในการเรียนรู้</text>

  <text x="50" y="175" fill="#e94560" font-size="11" font-weight="bold">2. Forgetting Curve Operator</text>
  <text x="50" y="191" fill="#888" font-size="9">F̂(K)|ψ(t)⟩ = e^(−λt)|ψ₀⟩ — การลืมแบบควอนตัม</text>

  <text x="50" y="210" fill="#e94560" font-size="11" font-weight="bold">3. Asimov Constraint</text>
  <text x="50" y="226" fill="#888" font-size="9">∫(∇·J_harm)dt ≤ ε — ขอบเขตความปลอดภัยของ AI</text>

  <text x="270" y="140" fill="#e94560" font-size="11" font-weight="bold">4. Noosphere Resonance</text>
  <text x="270" y="156" fill="#888" font-size="9">∇²Ψ − (1/v²)∂²Ψ/∂t² = ρ_I — การแพร่กระจายแนวคิด</text>

  <text x="270" y="175" fill="#e94560" font-size="11" font-weight="bold">5. Abstraction Gradient</text>
  <text x="270" y="191" fill="#888" font-size="9">A⃗ = ∇(K_comp/K_raw) — ทิศทางนามธรรม</text>

  <text x="270" y="210" fill="#e94560" font-size="11" font-weight="bold">6. Eureka Potential</text>
  <text x="270" y="226" fill="#888" font-size="9">φ = −∫(D_KL/E_compute)dV — ศักยภาพการค้นพบ</text>

  <rect x="30" y="235" width="460" height="35" rx="6" fill="#0f3460" opacity="0.5"/>
  <text x="260" y="258" text-anchor="middle" fill="#aaa" font-size="10">7. Algorithmic Elegance  8. Gen-Spec Uncertainty  9. Computational Inertia  10. Semantic Escape Velocity</text>

  <!-- ===== ASTRO-PHYSICAL ===== -->
  <rect x="510" y="80" width="460" height="200" rx="10" fill="#1a1a2e" stroke="#0f3460" stroke-width="1"/>
