  <text x="50" y="570" fill="#0f3460" font-size="11" font-weight="bold">41. Omega-Logic Prover</text>
  <text x="50" y="586" fill="#888" font-size="9">∀L: P(L⊢φ ∧ L⊢¬φ) = 0</text>

  <text x="50" y="605" fill="#0f3460" font-size="11" font-weight="bold">42. Manifold of All Computations</text>
