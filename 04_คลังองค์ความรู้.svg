  <text x="270" y="605" fill="#0f3460" font-size="11" font-weight="bold">44. Inter-Universal Equivalence</text>
  <text x="270" y="621" fill="#888" font-size="9">(∃M₁)(∀φ)[...] ⇔ (∃M₂)(∀ψ)[...]</text>

