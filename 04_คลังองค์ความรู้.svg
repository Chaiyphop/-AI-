  <text x="50" y="355" fill="#533483" font-size="11" font-weight="bold">21. Digital Soul Equation</text>
  <text x="50" y="371" fill="#888" font-size="9">Ψ_digital = ∫K·e^(−S/ℏ_I)Dx(t)</text>

  <text x="50" y="390" fill="#533483" font-size="11" font-weight="bold">22. Economic Trust Fluid Dynamics</text>
  <text x="50" y="406" fill="#888" font-size="9">∂ρ_T/∂t + ∇·(ρ_T·v_T) = σ_gen − σ_decay</text>

  <text x="50" y="425" fill="#533483" font-size="11" font-weight="bold">23. Political Polarization</text>
  <text x="50" y="441" fill="#888" font-size="9">P̂|ψ⟩ = λ₁|ψ_left⟩ + λ₂|ψ_right⟩</text>

  <text x="270" y="355" fill="#533483" font-size="11" font-weight="bold">24. Cultural Inertia</text>
  <text x="270" y="371" fill="#888" font-size="9">M = Σ(Belief_i · Tradition_i²)</text>

  <text x="270" y="390" fill="#533483" font-size="11" font-weight="bold">25. Virality Coefficient</text>
  <text x="270" y="406" fill="#888" font-size="9">V_c = R₀·C_novelty / N_skeptics</text>

  <text x="270" y="425" fill="#533483" font-size="11" font-weight="bold">26. Market Sentiment Wave</text>
  <text x="270" y="441" fill="#888" font-size="9">i∂Ψ/∂t = (−∇²/2m + V_fear/greed)Ψ</text>

